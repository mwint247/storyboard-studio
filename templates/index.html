<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Storyboard Studio</title>
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e9ef; --muted:#8b93a7; --accent:#6ea8fe; --accent2:#3ddc97; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
    header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
    header h1 { font-size:18px; margin:0; }
    main { display:grid; grid-template-columns:320px 1fr; min-height:calc(100vh - 53px); }
    .sidebar { border-right:1px solid var(--line); padding:16px; overflow:auto; }
    .content { padding:16px; overflow:auto; }
    button { background:var(--accent); color:#0b1020; border:0; border-radius:8px; padding:8px 12px; font-weight:600; cursor:pointer; }
    button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); font-weight:400; }
    button.danger { background:transparent; color:#ff6b6b; border:1px solid #50212a; }
    input,textarea,select { width:100%; background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px; margin:6px 0 12px; font:inherit; }
    label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
    .proj { margin-bottom:14px; }
    .proj > .projhead { display:flex; align-items:center; gap:8px; cursor:pointer; }
    .proj > .projhead h3 { margin:0; font-size:15px; }
    .proj .sb { padding:8px 10px; border:1px solid var(--line); border-radius:10px; margin:8px 0 8px 12px; cursor:pointer; background:var(--panel); }
    .proj .sb.active { border-color:var(--accent); }
    .proj .sb h4 { margin:0 0 2px; font-size:14px; }
    .proj .sb p { margin:0; color:var(--muted); font-size:11px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
    .frame { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; }
    .frame .shot { display:inline-block; font-size:11px; color:var(--accent2); border:1px solid #1d3b30; border-radius:20px; padding:2px 8px; margin-bottom:6px; }
    .frame h4 { margin:4px 0; font-size:15px; }
    .frame .cap { color:var(--fg); font-size:13px; }
    .frame .notes { color:var(--muted); font-size:12px; margin-top:6px; white-space:pre-wrap; }
    /* storyboard view */
    .sbimg-main { width:100%; max-height:520px; object-fit:contain; background:#000; border-radius:12px; margin-bottom:10px; border:1px solid var(--line); }
    .thumbs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
    .thumbs img { height:64px; width:96px; object-fit:cover; border-radius:8px; cursor:pointer; border:2px solid transparent; background:#000; }
    .thumbs img.active { border-color:var(--accent); }
    .empty { color:var(--muted); padding:40px; text-align:center; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .modal-bg { position:fixed; inset:0; background:#0008; display:none; align-items:center; justify-content:center; }
    .modal-bg.show { display:flex; }
    .modal { background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:20px; width:min(520px,94vw); max-height:92vh; overflow:auto; }
    .hint { color:var(--muted); font-size:12px; }
    #drop { border:1px dashed var(--line); border-radius:10px; padding:14px; text-align:center; color:var(--muted); margin:8px 0; }
    .preview { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
    .preview img { height:54px; width:78px; object-fit:cover; border-radius:6px; border:1px solid var(--line); }
  </style>
</head>
<body>
  <header>
    <h1>🎬 Storyboard Studio</h1>
    <span class="hint">Projects → Storyboards → Frames</span>
    <span style="flex:1"></span>
    <button class="ghost" id="newProject">+ New project</button>
    <button class="ghost" id="uploadBtn">⬆ Import</button>
  </header>
  <main>
    <aside class="sidebar" id="side"></aside>
    <section class="content" id="content">
      <div class="empty">Select a project, then create a storyboard under it.</div>
    </section>
  </main>

  <!-- New project modal -->
  <div class="modal-bg" id="projModal">
    <div class="modal">
      <h3>New project</h3>
      <label>Title</label><input id="pTitle" placeholder="e.g. The Park" />
      <label>Description</label><textarea id="pDesc" rows="3"></textarea>
      <div class="row"><button id="pSave">Create</button><button class="ghost" id="pCancel">Cancel</button></div>
    </div>
  </div>

  <!-- New storyboard modal (with inline images) -->
  <div class="modal-bg" id="sbModal">
    <div class="modal">
      <h3>New storyboard</h3>
      <label>Title</label><input id="sTitle" placeholder="e.g. Act 1 — Evan arrives" />
      <label>Description</label><textarea id="sDesc" rows="2"></textarea>
      <label>Images (optional, multiple)</label>
      <input id="sImages" type="file" multiple accept=".png,.jpg,.jpeg,.webp,.gif,.bmp" />
      <div class="preview" id="sPreview"></div>
      <div class="row"><button id="sSave">Create</button><button class="ghost" id="sCancel">Cancel</button></div>
    </div>
  </div>

  <!-- New frame modal -->
  <div class="modal-bg" id="frameModal">
    <div class="modal">
      <h3>Add frame</h3>
      <label>Title</label><input id="fTitle" placeholder="Frame 1 — Evan enters" />
      <label>Dialogue / caption</label><textarea id="fCap" rows="2"></textarea>
      <label>Shot type</label><select id="fShot"></select>
      <label>Visual notes</label><textarea id="fNotes" rows="3"></textarea>
      <div class="row"><button id="fSave">Add frame</button><button class="ghost" id="fCancel">Cancel</button></div>
    </div>
  </div>

  <!-- Import modal -->
  <div class="modal-bg" id="uploadModal">
    <div class="modal">
      <h3>Import storyboard (text)</h3>
      <p class="hint">JSON, CSV, or Markdown scene list. Images are added per storyboard instead.</p>
      <label>Title (optional)</label><input id="uTitle" placeholder="leave blank to use filename" />
      <div id="drop">Drop a file or use the button below</div>
      <input id="uFile" type="file" multiple accept=".json,.csv,.md,.txt" />
      <div class="row"><button id="uSave">Import</button><button class="ghost" id="uCancel">Cancel</button></div>
    </div>
  </div>

<script>
const $ = s => document.querySelector(s);
let activeProject = null, activeStoryboard = null, mainImg = 0;
const SHOT_TYPES = {{ shot_types | tojson }};

async function api(method, url, body, isForm) {
  const opts = { method, headers: {} };
  if (body) {
    if (isForm) opts.body = body;
    else { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  }
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function shortDate(s){return (s||'').slice(0,10);}

async function refresh() {
  const projects = await api('GET', '/api/projects');
  renderSidebar(projects);
  if (activeProject) showProject(activeProject, projects);
}

function renderSidebar(projects) {
  const el = $('#side'); el.innerHTML = '';
  projects.forEach(p => {
    const wrap = document.createElement('div'); wrap.className = 'proj';
    const head = document.createElement('div'); head.className = 'projhead';
    head.innerHTML = `<h3>${esc(p.title)}</h3><span class="hint">${p.storyboards.length}</span>`;
    head.onclick = () => { activeProject = p.id; activeStoryboard = null; refresh(); };
    wrap.appendChild(head);
    const add = document.createElement('div'); add.className='hint'; add.style.margin='4px 0 2px 12px';
    add.textContent = '+ storyboard'; add.style.cursor='pointer';
    add.onclick = (e) => { e.stopPropagation(); activeProject = p.id; openSbModal(); };
    wrap.appendChild(add);
    p.storyboards.forEach(s => {
      const d = document.createElement('div');
      d.className = 'sb' + (activeProject===p.id && activeStoryboard===s.id ? ' active' : '');
      d.innerHTML = `<h4>${esc(s.title)}</h4><p>${s.frames.length} frame(s)${s.images.length?', '+s.images.length+' img':''}</p>`;
      d.onclick = () => { activeProject = p.id; activeStoryboard = s.id; mainImg = 0; refresh(); };
      wrap.appendChild(d);
    });
    el.appendChild(wrap);
  });
}

async function showProject(pid, projects) {
  const p = projects.find(x => x.id === pid);
  if (!p) { $('#content').innerHTML = '<div class="empty">Select a project.</div>'; return; }
  const s = p.storyboards.find(x => x.id === activeStoryboard);
  if (!s) {
    $('#content').innerHTML = `
      <div class="row" style="margin-bottom:14px"><h2 style="margin:0">${esc(p.title)}</h2>
      <span style="flex:1"></span>
      <button class="danger" id="delProj">Delete project</button></div>
      <p class="hint">${esc(p.description||'')}</p>
      <div class="empty">No storyboards yet — click “+ storyboard” in the sidebar.</div>`;
    $('#delProj').onclick = async () => {
      if (confirm('Delete this project?')) { await api('DELETE','/api/projects/'+pid); activeProject=null; activeStoryboard=null; refresh(); }
    };
    return;
  }
  renderStoryboard(p, s);
}

function renderStoryboard(p, s) {
  const imgs = s.images || [];
  const main = imgs.length ? `/uploads/${imgs[Math.min(mainImg, imgs.length-1)]}` : '';
  const thumbs = imgs.map((im,i)=>`<img src="/uploads/${esc(im)}" class="${i===Math.min(mainImg,imgs.length-1)?'active':''}" data-i="${i}" />`).join('');
  const frames = [...s.frames].sort((a,b)=>a.order-b.order);
  $('#content').innerHTML = `
    <div class="row" style="margin-bottom:12px">
      <div><h2 style="margin:0">${esc(p.title)}</h2><h3 style="margin:2px 0 0;color:var(--accent2)">${esc(s.title)}</h3></div>
      <span style="flex:1"></span>
      <button id="addFrame">+ Add frame</button>
      <button class="ghost" id="exportBtn">⬇ Export JSON</button>
      <button class="danger" id="delSb">Delete storyboard</button>
    </div>
    <p class="hint">${esc(s.description||'')}</p>
    ${main ? `<img class="sbimg-main" src="${main}" alt="" /><div class="thumbs" id="thumbs">${thumbs}</div>` : '<p class="hint">No images for this storyboard.</p>'}
    <div class="grid" id="frameGrid"></div>`;
  if (imgs.length) {
    document.querySelectorAll('#thumbs img').forEach(t => t.onclick = () => { mainImg = +t.dataset.i; renderStoryboard(p, s); });
  }
  const g = $('#frameGrid');
  if (!frames.length) g.innerHTML = '<div class="empty">No frames yet — add the first shot.</div>';
  frames.forEach(f => {
    const d = document.createElement('div'); d.className='frame';
    d.innerHTML = `<span class="shot">${esc(f.shot||'shot')}</span>
      <h4>${esc(f.title||'Untitled')}</h4>
      <div class="cap">${esc(f.caption||'')}</div>
      <div class="notes">${esc(f.notes||'')}</div>
      <div class="row" style="margin-top:8px"><button class="ghost" data-del="${f.id}">remove</button></div>`;
    d.querySelector('[data-del]').onclick = async () => {
      await api('DELETE',`/api/projects/${p.id}/storyboards/${s.id}/frames/${f.id}`);
      renderStoryboard(p, s);
    };
    g.appendChild(d);
  });
  $('#addFrame').onclick = openFrameModal;
  $('#delSb').onclick = async () => {
    if (confirm('Delete this storyboard?')) { await api('DELETE',`/api/projects/${p.id}/storyboards/${s.id}`); activeStoryboard=null; refresh(); }
  };
  $('#exportBtn').onclick = async () => {
    const b = await api('GET',`/api/projects/${p.id}/storyboards/${s.id}/export`);
    const blob = new Blob([JSON.stringify(b,null,2)],{type:'application/json'});
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download = (s.title||'storyboard').replace(/[^a-z0-9]+/gi,'_').toLowerCase()+'.json'; a.click();
  };
}

// modals
function openModal(id){ $(id).classList.add('show'); }
function closeModal(id){ $(id).classList.remove('show'); }

$('#newProject').onclick = () => { $('#pTitle').value=''; $('#pDesc').value=''; openModal('#projModal'); };
$('#pCancel').onclick = () => closeModal('#projModal');
$('#pSave').onclick = async () => {
  await api('POST','/api/projects',{title:$('#pTitle').value,description:$('#pDesc').value});
  closeModal('#projModal'); refresh();
};

function openSbModal(){
  $('#sTitle').value=''; $('#sDesc').value=''; $('#sImages').value=''; $('#sPreview').innerHTML='';
  openModal('#sbModal');
}
$('#sCancel').onclick = () => closeModal('#sbModal');
$('#sImages').onchange = () => {
  const prev = $('#sPreview'); prev.innerHTML='';
  [...$('#sImages').files].forEach(f => {
    const u = URL.createObjectURL(f); const im = document.createElement('img'); im.src=u; prev.appendChild(im);
  });
};
$('#sSave').onclick = async () => {
  const fd = new FormData();
  fd.append('title', $('#sTitle').value);
  fd.append('description', $('#sDesc').value);
  for (const f of $('#sImages').files) fd.append('image', f);
  const s = await api('POST',`/api/projects/${activeProject}/storyboards`, fd, true);
  closeModal('#sbModal'); activeStoryboard = s.id; mainImg=0; refresh();
};

function openFrameModal(){
  $('#fTitle').value=''; $('#fCap').value=''; $('#fNotes').value='';
  const sel=$('#fShot'); sel.innerHTML='';
  SHOT_TYPES.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sel.appendChild(o);});
  openModal('#frameModal');
}
$('#fCancel').onclick = () => closeModal('#frameModal');
$('#fSave').onclick = async () => {
  await api('POST',`/api/projects/${activeProject}/storyboards/${activeStoryboard}/frames`,{
    title:$('#fTitle').value, caption:$('#fCap').value, shot:$('#fShot').value, notes:$('#fNotes').value });
  closeModal('#frameModal'); refresh();
};

// import (text)
$('#uploadBtn').onclick = () => { $('#uTitle').value=''; $('#uFile').value=''; openModal('#uploadModal'); };
$('#uCancel').onclick = () => closeModal('#uploadModal');
$('#uSave').onclick = async () => {
  const files = $('#uFile').files;
  if (!files.length) { alert('Choose a file'); return; }
  const fd = new FormData();
  for (const f of files) fd.append('file', f);
  if ($('#uTitle').value) fd.append('title', $('#uTitle').value);
  const res = await fetch('/api/import',{method:'POST',body:fd});
  if (!res.ok) { alert('Import failed: '+await res.text()); return; }
  const d = await res.json();
  closeModal('#uploadModal'); activeProject = d.imported[0]; activeStoryboard=null; refresh();
};

refresh();
</script>
</body>
</html>
